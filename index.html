<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DALTON GANG | الموقع الرسمي</title>
    <style>
        :root { --p-color: #8a2be2; --bg-dark: #050505; }
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Cairo', sans-serif; background: var(--bg-dark); color: white; overflow-x: hidden; }

        /* الخلفية المحدثة */
        .main-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.85)), url('main_bg.jpg');
            background-size: cover; background-position: center; z-index: -1;
        }

        /* شاشة الترحيب المحدثة */
        #intro {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 9999; transition: 1.5s;
        }
        .intro-txt { font-size: 45px; font-weight: 900; text-shadow: 0 0 20px var(--p-color); animation: pulse 2s infinite; }
        .intro-sub { font-size: 22px; color: #bbb; margin-top: 15px; opacity: 0; animation: fadeIn 1s forwards 1.5s; }

        @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.05); opacity: 0.8; } }
        @keyframes fadeIn { to { opacity: 1; } }

        /* الصفحة الرئيسية بتوزيع جديد */
        .main-content { display: flex; flex-direction: column; align-items: center; justify-content: space-around; min-height: 100vh; opacity: 0; transition: 1.5s; padding: 40px 0; }
        .active { opacity: 1; }

        .logos-box { display: flex; gap: 120px; margin-bottom: 40px; } /* تفرقة أكبر */
        .logo-img {
            width: 200px; height: 200px; border-radius: 50%; opacity: 0.6;
            border: 4px solid var(--p-color); transition: 0.6s;
            box-shadow: 0 0 30px rgba(138, 43, 226, 0.2); object-fit: cover;
        }
        .logo-img:hover { opacity: 1; transform: translateY(-15px) scale(1.1); box-shadow: 0 0 50px var(--p-color); }

        .btns { display: flex; gap: 40px; margin-top: 20px; }
        .btn-style {
            padding: 22px 50px; font-size: 24px; font-weight: bold; color: white;
            background: rgba(138, 43, 226, 0.15); border: 2px solid var(--p-color);
            border-radius: 15px; cursor: pointer; transition: 0.4s; text-decoration: none;
            backdrop-filter: blur(8px);
        }
        .btn-style:hover { background: var(--p-color); transform: scale(1.08); box-shadow: 0 0 40px var(--p-color); }

        /* الصفحات الداخلية */
        .page-div { display: none; padding: 50px 20px; max-width: 1000px; margin: auto; animation: slideUp 0.6s; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }

        .back { cursor: pointer; color: var(--p-color); font-weight: bold; font-size: 22px; margin-bottom: 40px; display: inline-block; transition: 0.3s; }
        .back:hover { letter-spacing: 2px; color: white; }

        /* المسؤولين بتنسيق Boss أولاً */
        .staff-wrap { text-align: center; }
        .boss-card { background: linear-gradient(45deg, #222, var(--p-color)); padding: 40px; border-radius: 20px; margin-bottom: 50px; box-shadow: 0 0 40px var(--p-color); }
        .boss-tag { font-size: 14px; background: #000; padding: 5px 15px; border-radius: 5px; }
        .boss-n { font-size: 55px; display: block; font-weight: 900; margin-top: 10px; }

        .sub-staff { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .s-card { background: rgba(255,255,255,0.03); padding: 25px; border-radius: 15px; border-left: 5px solid var(--p-color); transition: 0.3s; }
        .s-card:hover { background: rgba(138, 43, 226, 0.1); }

        /* القوانين باللون البنفسجي المحدث */
        .rule-item { 
            background: rgba(138, 43, 226, 0.05); border-right: 5px solid var(--p-color);
            padding: 20px; margin-bottom: 15px; border-radius: 8px; font-size: 19px;
            transition: 0.3s; cursor: default;
        }
        .rule-item:hover { background: rgba(138, 43, 226, 0.15); transform: translateX(-10px); }
        .rule-num { color: var(--p-color); font-weight: bold; margin-left: 10px; }
    </style>
</head>
<body>

    <div class="main-bg"></div>

    <!-- شاشة الترحيب -->
    <div id="intro">
        <h1 class="intro-txt">مرحباً بك في عصابة DALTON</h1>
        <p class="intro-sub">منور العصابة.. وشكراً لأنك اخترت عصابتنا</p>
    </div>

    <!-- الصفحة الرئيسية -->
    <div id="home" class="main-content">
        <div class="logos-box">
            <img src="dalton_logo.png" class="logo-img" alt="Dalton">
            <img src="server_logo.png" class="logo-img" alt="Server">
        </div>
        <div class="btns">
            <button class="btn-style" onclick="playClick(); showPage('rules')">قراءة القوانين</button>
            <button class="btn-style" onclick="playClick(); showPage('staff')">مسؤولين العصابة</button>
        </div>
    </div>

    <!-- صفحة القوانين (20 قانون) -->
    <div id="rules" class="page-div">
        <div class="back" onclick="playClick(); showPage('home')">⬅ العودة للرئيسية</div>
        <h2 style="color: var(--p-color); font-size: 40px; margin-bottom: 30px;">⚖️ الميثاق الرسمي لـ DALTON</h2>
        <div id="rules-container">
            <!-- سيتم تعبئتها بواسطة JS -->
        </div>
    </div>

    <!-- صفحة المسؤولين -->
    <div id="staff" class="page-div">
        <div class="back" onclick="playClick(); showPage('home')">⬅ العودة للرئيسية</div>
        <div class="staff-wrap">
            <div class="boss-card">
                <span class="boss-tag">THE BOSS</span>
                <span class="boss-n">_l3ep</span>
            </div>
            <div class="sub-staff">
                <div class="s-card"><h3>Co BOSS</h3><p>pqfy9</p></div>
                <div class="s-card"><h3>Manager</h3><p>asd702._67157</p></div>
                <div class="s-card"><h3>Co Manager</h3><p>qjizn</p></div>
                <div class="s-card"><h3>Co Manager</h3><p>tamim__0073</p></div>
            </div>
        </div>
    </div>

    <!-- صوت النقرة -->
    <audio id="clickSound" src="https://www.soundjay.com/buttons/button-16.mp3"></audio>

    <script>
        // إخفاء الترحيب
        window.onload = function() {
            setTimeout(() => {
                const intro = document.getElementById('intro');
                intro.style.opacity = '0';
                setTimeout(() => {
                    intro.style.display = 'none';
                    document.getElementById('home').classList.add('active');
                }, 1000);
            }, 4500);
            loadRules();
        };

        function playClick() { document.getElementById('clickSound').play(); }

        function showPage(pId) {
            document.querySelectorAll('.page-div, .main-content').forEach(el => { el.style.display = 'none'; el.classList.remove('active'); });
            if(pId === 'home') {
                document.getElementById('home').style.display = 'flex';
                setTimeout(() => document.getElementById('home').classList.add('active'), 50);
            } else {
                document.getElementById(pId).style.display = 'block';
            }
        }

        function loadRules() {
            const rules = [
                "احترام مسؤولي العصابة واجب؛ مخالفتهم تعرضك للإنذار الأول.",
                "عند وصولك إلى (٣) إنذارات، سيتم طردك فوراً من العصابة.",
                "في حال تم 'تدبيلك' في الراديو وقت المداهمة، سيتم محاسبتك.",
                "يمنع القيام بأي مداهمة دون إذن مسبق؛ المخالفة تعني الفصل.",
                "خيانة العصابة أو تسريب المعلومات = فصل + بلاك ليست نهائي.",
                "التعاون مع العسكريين أو الأعداء = بلاك ليست + فصل مباشر.",
                "عدم الالتزام بقوانين السرقة في السيرفر الأساسي = طرد.",
                "يمنع افتعال المشاكل الداخلية؛ أي نزاع يحل عبر المسؤولين.",
                "الالتزام بالزي الرسمي والسيارات المعتمدة في المهام الرسمية.",
                "التفاعل الأسبوعي إلزامي؛ الغياب بدون عذر يعرضك للاستبعاد.",
                "يمنع طلب الرتب نهائياً؛ الرتبة تُعطى بالاجتهاد والولاء فقط.",
                "التواجد في الراديو إلزامي عند دخولك للمدينة، حتى لو كنت تتجول.",
                "يمنع التخريب على عمليات الحلفاء أو سرقة غنائمهم.",
                "يجب إبلاغ الإدارة عند الغياب عن المدينة لأكثر من 3 أيام.",
                "يمنع استخدام اسم العصابة في مشاكل شخصية خارج إطار العمل.",
                "الهدوء التام في الراديو وقت العمليات العسكرية الكبرى.",
                "ممنوع استخدام الأسلحة الثقيلة إلا بأمر مباشر من القائد.",
                "أي عضو يتم القبض عليه، لا يمنح أي معلومات عن زملائه مهما حدث.",
                "الولاء للعصابة فوق كل شيء؛ دالتون هي عائلتك الأولى.",
                "قائد العصابة (The Boss) هو المرجع النهائي لجميع القرارات."
            ];
            const container = document.getElementById('rules-container');
            rules.forEach((r, i) => {
                container.innerHTML += `<div class="rule-item"><span class="rule-num">${i+1}.</span> ${r}</div>`;
            });
        }
    </script>
</body>
</html>
